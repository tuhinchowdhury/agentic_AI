name: Schema Impact Check

on:
  push:
    branches:
      - develop

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4   # ✅ updated

      - name: Build Docker Image
        run: docker build -t schema-analyzer .

      - name: Run Analyzer
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            schema-analyzer